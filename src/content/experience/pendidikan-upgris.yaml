description:
  id: Lulus dengan IPK 3.84. Fokus skripsi pada Sistem Pendukung Keputusan (SPK) menggunakan implementasi metode Simple Additive Weighting (SAW) dengan optimasi pembobotan Rank Order Centroid (ROC) untuk penilaian kinerja peserta magang di Dinkominfotik Kabupaten Brebes.
  en: Graduated with a 3.84 GPA. Undergraduate thesis focused on Decision Support Systems (DSS) implementing the Simple Additive Weighting (SAW) method with Rank Order Centroid (ROC) weighting optimization for intern performance evaluation at Dinkominfotik Brebes Regency.
